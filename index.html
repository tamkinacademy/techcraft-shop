<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161a20">
<title>অনলাইন শপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161a20;--bg2:#1c2128;--card:#222831;--card2:#2a313b;--line:#323a46;
  --tx:#eef1f5;--mut:#98a4b3;--gold:#e8b94a;--gold2:#f6d27a;--mint:#5eead4;--red:#ff7a7a;--ok:#4ade80;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri','Anek Bangla',system-ui,sans-serif;font-size:16px;line-height:1.5;
  background-image:radial-gradient(700px 400px at 90% -5%,rgba(232,185,74,.10),transparent 60%),radial-gradient(600px 400px at -10% 10%,rgba(94,234,212,.08),transparent 60%);background-attachment:fixed}
h1,h2,h3,.disp{font-family:'Anek Bangla','Hind Siliguri',sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
img{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.notice{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#2a2108;text-align:center;font-weight:600;font-size:14px;padding:7px 12px}
header.top{position:sticky;top:0;z-index:30;background:rgba(22,26,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1f3a33,#0f1d1a);border:1px solid #2f5a4f;display:grid;place-items:center;font-family:'Anek Bangla';font-weight:800;font-size:18px;flex:none;overflow:hidden}
.logo b{color:var(--gold)}.logo i{color:var(--mint);font-style:normal}
.brand h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#2a2108;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cnt:empty,.cnt[data-n="0"]{display:none}
.search{position:relative;padding:0 0 12px}
.search input{width:100%;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 16px 0 44px;outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;color:var(--mut)}
.hero{margin:18px 0 8px;border-radius:26px;padding:28px 22px;background:linear-gradient(135deg,#1f2b2a 0%,#222831 55%,#2b2a22 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,74,.28),transparent 65%)}
.hero .tag{display:inline-block;font-size:12.5px;letter-spacing:.3px;color:var(--mint);border:1px solid rgba(94,234,212,.35);border-radius:99px;padding:3px 12px;margin-bottom:12px}
.hero h2{font-size:clamp(26px,6vw,40px);font-weight:800;line-height:1.2;max-width:620px}
.hero h2 span{color:var(--gold)}
.hero p{color:var(--mut);margin:10px 0 18px;max-width:520px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a2108;border:0;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.wa{background:linear-gradient(135deg,#25d366,#1fb457);color:#042b12}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.trust div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:13px;color:var(--mut)}
.trust b{display:block;color:var(--tx);font-size:14px;margin-top:2px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#2a2108}
.tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px;gap:10px}
.tools .n{color:var(--mut);font-size:14px}
.tools select{background:var(--card);border:1px solid var(--line);border-radius:12px;height:38px;padding:0 10px;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s;animation:up .45s both}
.card:hover{transform:translateY(-3px);border-color:#46525f}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{position:relative;aspect-ratio:1/1;background:var(--card2);overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:#2a2108;font-size:12px;font-weight:700;border-radius:8px;padding:2px 9px}
.badge.red{background:var(--red);color:#2b0a0a;left:auto;right:10px}
.oos{position:absolute;inset:0;background:rgba(22,26,32,.66);display:grid;place-items:center;font-weight:700;font-size:15px}
.cb{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb .c{font-size:12px;color:var(--mint)}
.cb .nm{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;min-height:2.7em}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font-size:19px;color:var(--gold);font-family:'Anek Bangla'}
.pr s{color:var(--mut);font-size:13px}
.add{margin-top:auto;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.add:active{background:var(--gold);color:#2a2108}
.empty{text-align:center;color:var(--mut);padding:60px 10px}
.empty .e{font-size:44px}
footer{margin:46px 0 0;border-top:1px solid var(--line);padding:26px 0 90px;background:var(--bg2)}
footer .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
footer small{color:var(--mut)}
.how{display:grid;gap:10px;margin-top:30px}
@media(min-width:640px){.how{grid-template-columns:repeat(3,1fr)}}
.how div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.how b{color:var(--gold);font-family:'Anek Bangla'}
.how span{display:block;color:var(--mut);font-size:14px}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,10,13,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;animation:sl .3s both;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sl{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;max-height:90vh}}
.sh-h{position:sticky;top:0;z-index:2;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-h h3{font-size:19px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--card2)}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:18px;border-radius:6px}
.pd{padding:16px 18px 22px;display:grid;gap:12px}
.pd h2{font-size:22px;line-height:1.3}
.pd .desc{color:#c7cfda;white-space:pre-line}
.qty{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
.qty button{width:40px;height:40px;font-size:20px;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.ci img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--card2)}
.ci .t{font-weight:600;line-height:1.3}
.ci .p{color:var(--gold);font-weight:700}
.ci .rm{color:var(--red);font-size:13px}
.sum{padding:14px 18px;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between;color:var(--mut)}
.sum .tot{color:var(--tx);font-size:19px;font-weight:700;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.sum .tot b{color:var(--gold)}
.frm{padding:6px 18px 20px;display:grid;gap:12px}
.frm label{display:grid;gap:6px;font-size:14px;color:var(--mut);font-weight:500}
.frm input,.frm textarea,.frm select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%}
.frm input:focus,.frm textarea:focus,.frm select:focus{border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:600;color:var(--mut);line-height:1.3}
.seg button small{display:block;font-weight:400;font-size:12px}
.seg button.on{border-color:var(--gold);color:var(--tx);background:rgba(232,185,74,.12)}
.pay{background:rgba(94,234,212,.08);border:1px solid rgba(94,234,212,.3);border-radius:14px;padding:12px 14px;font-size:14px;color:#c9f7ef}
.pay b{color:var(--mint);font-size:17px;letter-spacing:.5px}
.err{color:var(--red);font-size:13px;min-height:0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:none}
.fab.show{display:block}
.fab .btn{height:54px;padding:0 24px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.25s;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%)}
.done{padding:36px 22px;text-align:center;display:grid;gap:12px}
.done .e{font-size:54px}
</style>
</head>
<body>
<div id="notice"></div>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand"><div class="logo" id="logo"></div><h1 id="shopName">অনলাইন শপ</h1></div>
    <button class="icon-btn" id="openCart" aria-label="কার্ট">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.6 9H8z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span class="cnt" id="cartCnt" data-n="0"></span>
    </button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="পণ্য খুঁজুন…" autocomplete="off">
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <span class="tag" id="heroTag">নতুন কালেকশন</span>
    <h2 id="heroTitle"></h2>
    <p id="heroText"></p>
    <a class="btn" href="#shop">পণ্য দেখুন ↓</a>
  </section>
  <div class="trust" id="trust"></div>
  <div class="cats" id="cats"></div>
  <div class="tools"><span class="n" id="count"></span>
    <select id="sort"><option value="new">নতুন আগে</option><option value="lo">দাম: কম → বেশি</option><option value="hi">দাম: বেশি → কম</option></select>
  </div>
  <div id="shop" class="grid"></div>
  <div class="how">
    <div><b>১. পছন্দ করুন</b><span>পণ্য বেছে কার্টে যোগ করুন</span></div>
    <div><b>২. তথ্য দিন</b><span>নাম, ফোন ও ঠিকানা লিখুন</span></div>
    <div><b>৩. WhatsApp-এ কনফার্ম</b><span>অর্ডার মেসেজ পাঠালেই আমরা কনফার্ম করব</span></div>
  </div>
</main>

<footer><div class="wrap"><div class="row">
  <div><div class="disp" style="font-weight:700;font-size:18px" id="fName"></div><small>© <span id="yr"></span> সর্বস্বত্ব সংরক্ষিত</small></div>
  <div style="display:flex;gap:10px" id="fLinks"></div>
</div></div></footer>

<div class="fab" id="fab"><button class="btn" id="fabBtn"></button></div>
<div class="toast" id="toast"></div>

<div class="ov" id="ovP"><div class="sheet" id="shP"></div></div>
<div class="ov" id="ovC"><div class="sheet" id="shC"></div></div>

<script src="shop-data.js"></script>
<script>
const DEF={name:'অনলাইন শপ',tag:'নতুন কালেকশন',title:'সেরা মানের পণ্য, সহজ অর্ডার',text:'পছন্দের পণ্য বেছে নিন, WhatsApp-এ অর্ডার করুন।',whatsapp:'',nagad:'',fb:'',notice:'',feeIn:60,feeOut:120,freeAbove:0,cod:true,t1:'সহজ অর্ডার|WhatsApp-এ',t2:'সরাসরি|যোগাযোগ',t3:'নিরাপদ|পেমেন্ট'};
const D=window.SHOP||{settings:{},cats:[],products:[]};
const ST=Object.assign({},DEF,D.settings||{});
const CATS=D.cats||[];
const PRODUCTS=(D.products||[]).filter(p=>!p.hidden);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bnd='০১২৩৪৫৬৭৮৯';
const bn=n=>String(n).replace(/\d/g,d=>bnd[d]);
const tk=n=>'৳'+bn(Math.round(n).toLocaleString('en-US'));
let cat='all',sort='new',qs='';
let cart={};try{cart=JSON.parse(localStorage.getItem('shop_cart')||'{}')}catch(e){}
const saveCart=()=>{try{localStorage.setItem('shop_cart',JSON.stringify(cart))}catch(e){}};
Object.keys(cart).forEach(id=>{if(!PRODUCTS.find(p=>p.id===id))delete cart[id]});
const byId=id=>PRODUCTS.find(p=>p.id===id);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* header */
document.title=ST.name+' – অনলাইন শপ';
$('#shopName').textContent=ST.name;$('#fName').textContent=ST.name;$('#yr').textContent=bn(new Date().getFullYear());
$('#logo').innerHTML=ST.logo?`<img src="${esc(ST.logo)}" style="width:100%;height:100%;object-fit:cover" alt="">`:`<b>${esc((ST.name||'S')[0])}</b>`;
if(ST.notice)$('#notice').innerHTML=`<div class="notice">${esc(ST.notice)}</div>`;
$('#heroTag').textContent=ST.tag;
$('#heroText').textContent=ST.text;
$('#heroTitle').textContent=ST.title;
$('#trust').innerHTML=[ST.t1,ST.t2,ST.t3].map(t=>{const [a,b]=String(t).split('|');return `<div>${esc(a)}<b>${esc(b||'')}</b></div>`}).join('');
const wa=ST.whatsapp?String(ST.whatsapp).replace(/\D/g,''):'';
$('#fLinks').innerHTML=(wa?`<a class="btn wa" style="height:42px" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:'')+(ST.fb?`<a class="btn ghost" style="height:42px" href="${esc(ST.fb)}" target="_blank" rel="noopener">Facebook</a>`:'');

/* listing */
function renderCats(){
  const used=CATS.filter(c=>PRODUCTS.some(p=>p.cat===c.id));
  $('#cats').innerHTML=`<button class="chip ${cat==='all'?'on':''}" data-c="all">সব</button>`+used.map(c=>`<button class="chip ${cat===c.id?'on':''}" data-c="${esc(c.id)}">${esc(c.icon||'')} ${esc(c.name)}</button>`).join('');
}
$('#cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;renderCats();renderGrid()};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();renderGrid()};
$('#sort').onchange=e=>{sort=e.target.value;renderGrid()};
const disc=p=>p.old&&p.old>p.price?Math.round((1-p.price/p.old)*100):0;
function renderGrid(){
  let list=PRODUCTS.filter(p=>(cat==='all'||p.cat===cat)&&(!qs||(p.name+' '+(p.desc||'')).toLowerCase().includes(qs)));
  if(sort==='lo')list=[...list].sort((a,b)=>a.price-b.price);
  else if(sort==='hi')list=[...list].sort((a,b)=>b.price-a.price);
  else list=[...list].sort((a,b)=>(b.date||0)-(a.date||0));
  list=[...list.filter(p=>!p.out),...list.filter(p=>p.out)];
  $('#count').textContent=bn(list.length)+'টি পণ্য';
  if(!list.length){$('#shop').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="e">🛍️</div><p>${PRODUCTS.length?'কোনো পণ্য পাওয়া যায়নি':'শীঘ্রই নতুন পণ্য আসছে'}</p></div>`;return}
  $('#shop').innerHTML=list.map((p,i)=>{
    const d=disc(p),c=CATS.find(x=>x.id===p.cat);
    return `<article class="card" style="animation-delay:${Math.min(i,10)*40}ms">
      <div class="ph" data-open="${p.id}">${p.imgs&&p.imgs[0]?`<img loading="lazy" src="${p.imgs[0]}" alt="${esc(p.name)}">`:''}
        ${p.badge?`<span class="badge">${esc(p.badge)}</span>`:''}${d?`<span class="badge red">-${bn(d)}%</span>`:''}
        ${p.out?'<div class="oos">স্টক শেষ</div>':''}</div>
      <div class="cb">${c?`<span class="c">${esc(c.name)}</span>`:''}
        <div class="nm" data-open="${p.id}">${esc(p.name)}</div>
        <div class="pr"><b>${tk(p.price)}</b>${d?`<s>${tk(p.old)}</s>`:''}</div>
        <button class="add" data-add="${p.id}" ${p.out?'disabled style="opacity:.4"':''}>${p.out?'স্টক শেষ':'+ কার্টে যোগ করুন'}</button>
      </div></article>`}).join('');
}
$('#shop').onclick=e=>{
  const o=e.target.closest('[data-open]');if(o){openP(o.dataset.open);return}
  const a=e.target.closest('[data-add]');if(a){addCart(a.dataset.add,1)}
};

/* cart */
const cartCount=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const subtotal=()=>Object.entries(cart).reduce((s,[id,q])=>s+(byId(id)?.price||0)*q,0);
function addCart(id,q){cart[id]=Math.min(99,(cart[id]||0)+q);saveCart();upd();toast('কার্টে যোগ হয়েছে ✓')}
function upd(){
  const n=cartCount();$('#cartCnt').textContent=n?bn(n):'';$('#cartCnt').dataset.n=n;
  $('#fab').classList.toggle('show',n>0&&!$('#ovC').classList.contains('show')&&!$('#ovP').classList.contains('show'));
  $('#fabBtn').textContent='🛒 কার্ট দেখুন · '+tk(subtotal());
}
function show(ov,on){$(ov).classList.toggle('show',on);document.body.style.overflow=(document.querySelector('.ov.show'))?'hidden':'';upd()}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)show('#'+o.id,false)}));
$('#openCart').onclick=()=>openCart();$('#fabBtn').onclick=()=>openCart();

/* product sheet */
function openP(id){
  const p=byId(id);if(!p)return;
  const d=disc(p),c=CATS.find(x=>x.id===p.cat);let q=1;
  $('#shP').innerHTML=`<div class="sh-h"><h3>পণ্যের বিবরণ</h3><button class="x" data-x>✕</button></div>
  ${p.imgs&&p.imgs.length?`<div class="gal" id="gal">${p.imgs.map(s=>`<img src="${s}" alt="">`).join('')}</div>${p.imgs.length>1?`<div class="dots" id="dots">${p.imgs.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}`:''}
  <div class="pd">
    ${c?`<span style="color:var(--mint);font-size:13px">${esc(c.name)}</span>`:''}
    <h2>${esc(p.name)}</h2>
    <div class="pr"><b style="font-size:26px">${tk(p.price)}</b>${d?`<s style="font-size:16px">${tk(p.old)}</s><span class="badge" style="position:static">${bn(d)}% ছাড়</span>`:''}</div>
    ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}
    ${p.out?`<div class="pay" style="background:rgba(255,122,122,.1);border-color:rgba(255,122,122,.4);color:#ffd0d0">এই পণ্যটি এখন স্টকে নেই।</div>`:`
    <div class="row2"><div class="qty"><button data-m>−</button><span id="qv">১</span><button data-p>+</button></div><div style="color:var(--mut)">মোট: <b id="qt" style="color:var(--gold)">${tk(p.price)}</b></div></div>
    <div style="display:grid;gap:10px;grid-template-columns:1fr 1fr"><button class="btn ghost" data-a>কার্টে রাখুন</button><button class="btn" data-n>এখনই অর্ডার</button></div>`}
    <button class="btn ghost block" data-s style="height:42px">🔗 লিংক শেয়ার করুন</button>
  </div>`;
  show('#ovP',true);
  const g=$('#gal');if(g&&p.imgs.length>1)g.onscroll=()=>{const i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll('#dots i').forEach((x,j)=>x.classList.toggle('on',i===j))};
  const sh=$('#shP');
  sh.onclick=e=>{
    const t=e.target;
    if(t.closest('[data-x]'))show('#ovP',false);
    else if(t.closest('[data-m]')){q=Math.max(1,q-1);qu()}
    else if(t.closest('[data-p]')){q=Math.min(99,q+1);qu()}
    else if(t.closest('[data-a]')){addCart(p.id,q);show('#ovP',false)}
    else if(t.closest('[data-n]')){addCart(p.id,q);show('#ovP',false);openCart()}
    else if(t.closest('[data-s]')){share(p)}
  };
  function qu(){$('#qv').textContent=bn(q);$('#qt').textContent=tk(p.price*q)}
  try{history.replaceState(null,'','#p='+p.id)}catch(e){}
}
async function share(p){
  const url=location.href.split('#')[0]+'#p='+p.id;
  try{if(navigator.share){await navigator.share({title:p.name,text:p.name+' – '+tk(p.price),url});return}}catch(e){return}
  try{await navigator.clipboard.writeText(url);toast('লিংক কপি হয়েছে ✓')}catch(e){prompt('লিংক কপি করুন',url)}
}
$('#ovP').addEventListener('click',e=>{if(e.target.id==='ovP'||e.target.closest('[data-x]')){try{history.replaceState(null,'',location.pathname)}catch(x){}}});

/* cart sheet */
let zone='in',pay='cod',errMsg='';
const fee=()=>{const s=subtotal();if(!s)return 0;if(ST.freeAbove>0&&s>=ST.freeAbove)return 0;return zone==='in'?+ST.feeIn:+ST.feeOut};
function openCart(){drawCart();show('#ovC',true)}
function drawCart(){
  const ids=Object.keys(cart);
  const sh=$('#shC');
  if(!ids.length){sh.innerHTML=`<div class="sh-h"><h3>আপনার কার্ট</h3><button class="x" data-x>✕</button></div><div class="empty"><div class="e">🛒</div><p>কার্ট খালি আছে</p><button class="btn" data-x>কেনাকাটা করুন</button></div>`;sh.onclick=e=>{if(e.target.closest('[data-x]'))show('#ovC',false)};return}
  const f=fee(),sub=subtotal();
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('shop_cust')||'{}')}catch(e){return{}}})();
  sh.innerHTML=`<div class="sh-h"><h3>আপনার কার্ট (${bn(cartCount())})</h3><button class="x" data-x>✕</button></div>
  ${ids.map(id=>{const p=byId(id);return `<div class="ci"><img src="${(p.imgs&&p.imgs[0])||''}" alt=""><div><div class="t">${esc(p.name)}</div><div class="p">${tk(p.price)}</div><button class="rm" data-rm="${id}">সরান</button></div>
    <div class="qty"><button data-dec="${id}">−</button><span>${bn(cart[id])}</span><button data-inc="${id}">+</button></div></div>`}).join('')}
  <div class="sum"><div><span>সাবটোটাল</span><span>${tk(sub)}</span></div><div><span>ডেলিভারি চার্জ</span><span>${f?tk(f):'ফ্রি 🎉'}</span></div><div class="tot"><span>মোট</span><b>${tk(sub+f)}</b></div></div>
  <div class="frm">
    <label>আপনার নাম<input id="fn" value="${esc(saved.n||'')}" placeholder="পুরো নাম" autocomplete="name"></label>
    <label>মোবাইল নম্বর<input id="fp" value="${esc(saved.p||'')}" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel"></label>
    <label>পূর্ণ ঠিকানা<textarea id="fa" rows="2" placeholder="গ্রাম/এলাকা, থানা, জেলা">${esc(saved.a||'')}</textarea></label>
    <label>ডেলিভারি এলাকা<div class="seg"><button data-z="in" class="${zone==='in'?'on':''}">ঢাকার ভিতরে<small>${tk(ST.feeIn)}</small></button><button data-z="out" class="${zone==='out'?'on':''}">ঢাকার বাইরে<small>${tk(ST.feeOut)}</small></button></div></label>
    <label>পেমেন্ট<div class="seg"><button data-pay="cod" class="${pay==='cod'?'on':''}">ক্যাশ অন ডেলিভারি</button><button data-pay="nagad" class="${pay==='nagad'?'on':''}">নগদ</button></div></label>
    ${pay==='nagad'?`<div class="pay">নগদ (Send Money) করুন এই নম্বরে:<br><b>${esc(ST.nagad||'নম্বর যোগ করা হয়নি')}</b><br>পেমেন্টের পর TrxID মেসেজে জানাবেন।</div>`:''}
    <label>নোট (ঐচ্ছিক)<input id="fo" placeholder="যেমন: সাইজ/রঙ/সময়"></label>
    <div class="err" id="err">${esc(errMsg)}</div>
    <button class="btn wa block" id="send" style="height:54px">WhatsApp-এ অর্ডার পাঠান</button>
    <small style="color:var(--mut);text-align:center">মেসেজ পাঠানোর পর আমরা ফোনে/WhatsApp-এ কনফার্ম করব</small>
  </div>`;
  sh.onclick=e=>{
    const t=e.target,g=s=>t.closest(s);
    keep();
    if(g('[data-x]'))show('#ovC',false);
    else if(g('[data-rm]')){delete cart[g('[data-rm]').dataset.rm];saveCart();upd();drawCart()}
    else if(g('[data-inc]')){const i=g('[data-inc]').dataset.inc;cart[i]=Math.min(99,cart[i]+1);saveCart();upd();drawCart()}
    else if(g('[data-dec]')){const i=g('[data-dec]').dataset.dec;cart[i]--;if(cart[i]<1)delete cart[i];saveCart();upd();drawCart()}
    else if(g('[data-z]')){zone=g('[data-z]').dataset.z;drawCart()}
    else if(g('[data-pay]')){pay=g('[data-pay]').dataset.pay;drawCart()}
    else if(g('#send'))send();
  };
}
let tmpNote='';
function keep(){const v=id=>($(id)||{}).value||'';try{localStorage.setItem('shop_cust',JSON.stringify({n:v('#fn'),p:v('#fp'),a:v('#fa')}))}catch(e){}}
function send(){
  const n=$('#fn').value.trim(),p=$('#fp').value.trim(),a=$('#fa').value.trim(),o=$('#fo').value.trim();
  errMsg='';
  if(n.length<2)errMsg='নাম লিখুন';
  else if(!/^01\d{9}$/.test(p))errMsg='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন (01XXXXXXXXX)';
  else if(a.length<8)errMsg='পূর্ণ ঠিকানা লিখুন';
  if(errMsg){$('#err').textContent=errMsg;return}
  if(!wa){$('#err').textContent='দোকানের WhatsApp নম্বর সেট করা নেই';return}
  const base=location.href.split('#')[0];
  const lines=Object.entries(cart).map(([id,q],i)=>{const x=byId(id);return `${i+1}. ${x.name} × ${q} = ${tk(x.price*q)}`});
  const sub=subtotal(),f=fee();
  const msg=`🛒 *নতুন অর্ডার – ${ST.name}*\n\n${lines.join('\n')}\n\nসাবটোটাল: ${tk(sub)}\nডেলিভারি (${zone==='in'?'ঢাকার ভিতরে':'ঢাকার বাইরে'}): ${f?tk(f):'ফ্রি'}\n*মোট: ${tk(sub+f)}*\nপেমেন্ট: ${pay==='cod'?'ক্যাশ অন ডেলিভারি':'নগদ'}\n\n👤 নাম: ${n}\n📞 ফোন: ${p}\n📍 ঠিকানা: ${a}${o?'\n📝 নোট: '+o:''}\n\n${base}`;
  keep();
  window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
  cart={};saveCart();upd();
  $('#shC').innerHTML=`<div class="done"><div class="e">✅</div><h3>অর্ডার তৈরি হয়েছে!</h3><p style="color:var(--mut)">WhatsApp খুলেছে। সেখানে <b style="color:var(--tx)">Send</b> বাটনে চাপ দিলেই অর্ডার আমাদের কাছে পৌঁছাবে।</p><button class="btn" data-x>ঠিক আছে</button></div>`;
  $('#shC').onclick=e=>{if(e.target.closest('[data-x]'))show('#ovC',false)};
}

renderCats();renderGrid();upd();
const m=location.hash.match(/#p=(.+)/);if(m&&byId(m[1]))openP(m[1]);
</script>
</body>
</html>
